[project]
name = "neuroswitch"
version = "0.1.0"
description = "Brain-network reorganization after right-hand peripheral nerve injury (OpenNeuro ds008162)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "antspyx>=0.6.3",
    "nibabel>=5.4",
    "nilearn>=0.12",
    "templateflow>=24.0",
    "torch>=2.5",
    "torch-geometric>=2.6",
    "captum>=0.8",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "networkx>=3.3",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroswitch"]
