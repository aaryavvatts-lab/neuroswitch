<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="neuroswitch">
  <rect width="32" height="32" rx="7" fill="#1f5f8b"/>
  <!-- two hemispheres of nodes, with the link crossing the midline -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.92">
    <line x1="9" y1="11" x2="9" y2="21"/>
    <line x1="9" y1="11" x2="23" y2="21"/>
    <line x1="9" y1="21" x2="23" y2="11"/>
    <line x1="23" y1="11" x2="23" y2="21"/>
  </g>
  <g fill="#ffffff">
    <circle cx="9" cy="11" r="3"/>
    <circle cx="9" cy="21" r="3"/>
  </g>
  <g fill="#ea7317">
    <circle cx="23" cy="11" r="3"/>
    <circle cx="23" cy="21" r="3"/>
  </g>
</svg>
